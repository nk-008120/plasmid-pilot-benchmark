name: plasmid-pilot
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - biopython>=1.83
  - numpy>=1.24
  - pytest>=8
  - pip
  - matplotlib>=3.7      # scripts/07_figures.py
  - pip:
      - parasail>=1.3    # Smith-Waterman control arm (align.py) and Swiss-Prot homolog discovery
# For the real ESM-2 run install into this env: pip install torch transformers
# (or: pip install -e ".[esm,align,figures]")
